# The gateway is stateless: trajectories, judge cache and rate limits live in
# Redis, so any replica can serve any call of a session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgate-gateway
  labels: { app.kubernetes.io/name: agentgate-gateway }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: agentgate-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgate-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 40 # drain requests + flush the audit buffer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: agentgate-gateway }
      containers:
        - name: gateway
          image: agentgate/gateway
          args: ["serve", "--config", "/etc/agentgate/policy.yaml"]
          envFrom: [{ configMapRef: { name: agentgate-env } }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: policy, mountPath: /etc/agentgate, readOnly: true }
      volumes:
        - name: policy
          configMap: { name: agentgate-policy }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgate-gateway
spec:
  selector: { app.kubernetes.io/name: agentgate-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentgate-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agentgate-gateway }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgate-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: agentgate-gateway }
