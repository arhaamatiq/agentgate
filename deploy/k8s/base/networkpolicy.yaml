# Fail-closed by topology: tool servers, the judge and Redis accept traffic
# only from gateway pods. If the gateway is down, agents have no path to a
# tool at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentgate-gateway }
  ingress:
    - ports: [{ port: 8080 }] # agents, from anywhere the cluster allows
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams-only-from-gateway
spec:
  podSelector:
    matchLabels: { agentgate.dev/upstream: "true" }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentgate-gateway } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge-only-from-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentgate-judge }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentgate-gateway } } }]
      ports: [{ port: 50051 }]
